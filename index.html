<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG 抽獎工具</title>
    <link rel="stylesheet" href="ig01.css">
</head>
<body>

    <div class="card">
        <h2>IG 留言抽獎工具</h2>
        
        <div class="input-group">
            <label style="display:block; margin-bottom:8px; font-weight:600;">上傳匯出的 CSV 檔案：</label>
            <input type="file" id="csvFile" accept=".csv">
        </div>

        <div class="controls">
            <label style="cursor: pointer;"><input type="checkbox" id="noRepeat" checked> 排除重複帳號留言</label>
            <div>抽出人數：<input type="number" id="winnerCount" value="1" min="1"></div>
        </div>

        <button onclick="startDraw()">✨ 開始抽獎</button>
        <div id="status"></div>

        <div id="resultBox" class="result-box">
            <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">🎉 恭喜中獎者：</h3>
            <div id="winnerList"></div>
        </div>
    </div>

    <script src="ig02.js"></script>
</body>
</html>
