<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG 抽獎工具</title>
    <style>
        :root { --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background-color: #fafafa; color: #262626; }
        .card { background: white; border: 1px solid #dbdbdb; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 25px; font-weight: bold; }
        .input-group { margin-bottom: 20px; }
        input[type="file"] { width: 100%; padding: 15px; border: 2px dashed #dbdbdb; border-radius: 8px; box-sizing: border-box; cursor: pointer; background: #fafafa; transition: 0.3s; }
        input[type="file"]:hover { border-color: #bc1888; background: #fff5f8; }
        .controls { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .controls input[type="number"] { width: 60px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; margin-left: 8px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; background: var(--ig-gradient); color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(1px); }
        .result-box { margin-top: 30px; display: none; }
        .winner-item { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 5px solid #bc1888; }
        .winner-account { color: #bc1888; font-weight: bold; font-size: 1.1em; display: block; margin-bottom: 8px; }
        .winner-comment { color: #444; font-size: 0.95em; line-height: 1.5; background: #fcfcfc; padding: 10px; border-radius: 4px; border: 1px solid #f0f0f0; white-space: pre-wrap; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; color: #bc1888; }
    </style>
</head>
<body>

<div class="card">
    <h2>IG 留言抽獎工具</h2>
    
    <div class="input-group">
        <label style="display:block; margin-bottom:8px; font-weight:600;">上傳匯出的 CSV 檔案：</label>
        <input type="file" id="csvFile" accept=".csv">
    </div>

    <div class="controls">
        <label style="cursor: pointer;"><input type="checkbox" id="noRepeat" checked> 排除重複帳號留言</label>
        <div>抽出人數：<input type="number" id="winnerCount" value="1" min="1"></div>
    </div>

    <button onclick="startDraw()">✨ 開始抽獎</button>
    <div id="status"></div>

    <div id="resultBox" class="result-box">
        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">🎉 恭喜中獎者：</h3>
        <div id="winnerList"></div>
    </div>
</div>

<script>
    // 正規表達式 CSV 解析器：精準處理換行與逗號
    function parseCSV(text) {
        const regex = /("([^"]|"")*"|[^,"\r\n]*)(,|\r?\n|\r)/g;
        const rows = [];
        let currentRow = [];
        let match;

        while ((match = regex.exec(text + ",")) !== null) {
            let val = match[1];
            if (val.startsWith('"') && val.endsWith('"')) {
                val = val.substring(1, val.length - 1).replace(/""/g, '"');
            }
            currentRow.push(val.trim());
            if (match[3] !== ',') {
                if (currentRow.some(cell => cell !== "")) {
                    rows.push(currentRow);
                }
                currentRow = [];
            }
        }
        return rows;
    }

    function startDraw() {
        const fileInput = document.getElementById('csvFile');
        const status = document.getElementById('status');
        const winnerList = document.getElementById('winnerList');
        const resultBox = document.getElementById('resultBox');

        if (!fileInput.files[0]) {
            alert('請先選擇 CSV 檔案！');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const rows = parseCSV(e.target.result);
            if (rows.length < 2) {
                alert('檔案格式不正確或沒有留言資料！');
                return;
            }

            // 1. 動態讀取標題列，全轉小寫方便比對
            const headers = rows[0].map(h => h.toLowerCase().trim());
            
            // 2. 找出帳號與留言的正確欄位位置 (加入 user_name 判斷)
            let userIdx = headers.findIndex(h => h.includes('user_name') || h.includes('username') || h.includes('owner_username') || h === '帳號');
            let textIdx = headers.findIndex(h => h.includes('text') || h.includes('comment') || h === '留言');

            // 3. 防呆機制：如果標題寫得太奇怪找不到，預設抓第 2 欄當留言，第 3 欄當帳號
            if (userIdx === -1) userIdx = 2;
            if (textIdx === -1) textIdx = 1;

            let pool = [];
            
            // 從第 2 列開始讀取 (跳過標題)
            for (let i = 1; i < rows.length; i++) {
                if (rows[i].length > Math.max(userIdx, textIdx)) {
                    const username = rows[i][userIdx];
                    const comment = rows[i][textIdx];
                    
                    if (username && username !== "undefined") {
                        // 確保帳號前面有 @
                        const displayUser = username.startsWith('@') ? username : '@' + username;
                        pool.push({ 
                            user: displayUser, 
                            msg: comment || '(無內容)' 
                        });
                    }
                }
            }

            if (pool.length === 0) {
                alert('找不到有效的帳號資料，請確認 CSV 格式。');
                return;
            }

            // 排除重複帳號
            if (document.getElementById('noRepeat').checked) {
                const unique = new Map();
                pool.forEach(item => {
                    if (!unique.has(item.user)) unique.set(item.user, item);
                });
                pool = Array.from(unique.values());
            }

            const count = parseInt(document.getElementById('winnerCount').value);
            if (count > pool.length) {
                alert(`抽出人數 (${count}) 大於目前有效留言人數 (${pool.length})！`);
                return;
            }

            // 隨機洗牌抽獎
            const winners = pool.sort(() => 0.5 - Math.random()).slice(0, count);

            // 渲染畫面
            winnerList.innerHTML = '';
            winners.forEach(w => {
                winnerList.innerHTML += `
                    <div class="winner-item">
                        <span class="winner-account">👤 ${w.user}</span>
                        <div class="winner-comment">${w.msg}</div>
                    </div>
                `;
            });
            
            resultBox.style.display = 'block';
            status.innerText = `✅ 成功讀取欄位！共從 ${pool.length} 位有效參與者中抽出。`;
        };
        reader.readAsText(fileInput.files[0], 'UTF-8');
    }
</script>

</body>
</html>
